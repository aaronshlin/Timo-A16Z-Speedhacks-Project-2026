# new file, no collision with in-flight app/* work
name: timo-demo-packaging
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.demo
    init: true
    env_file: .timo-demo-package/runtime.env
    ports:
      - "127.0.0.1:${DEMO_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./.timo-demo-package/state:/state
      - ${DEMO_GOOGLE_TOKEN:?Set DEMO_GOOGLE_TOKEN to an existing absolute token.json path}:/secrets/google-token.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  ingress:
    image: nginx:1.27-alpine
    profiles: [live]
    configs:
      - source: callback_proxy
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [live]
    init: true
    command: ["tunnel", "--no-autoupdate", "--url", "http://ingress:8080"]
    depends_on: [ingress]
configs:
  callback_proxy:
    content: |
      server {
        listen 8080;
        client_max_body_size 256k;
        location = /health { proxy_pass http://app:3000; }
        location = /webhooks/dial { proxy_pass http://app:3000; }
        location ^~ /voice-mcp/ {
          proxy_pass http://app:3000;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_read_timeout 300s;
        }
        location / { return 404; }
      }
