[project]
name = "timo"
version = "0.1.0"
description = "An always-on agent that lives in a phone number and reaches out first with the next step."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "fastmcp",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "anthropic",
    "google-api-python-client",
    "google-auth-oauthlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
