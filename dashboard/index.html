<!doctype html>
<html lang="en">

<title>Timo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23a6b4fa'/%3E%3C/svg%3E">

<style>
/* ============ Theme tokens: swap the whole look from these two blocks ============ */
@property --sky-a { syntax: '<color>'; inherits: true; initial-value: #4a5f8f; }
@property --sky-b { syntax: '<color>'; inherits: true; initial-value: #a6b4fa; }
@property --sky-c { syntax: '<color>'; inherits: true; initial-value: #e8a48a; }
:root {
  color-scheme: light;

  --shadow-float: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(30,40,80,.08);
  --s1: 4px; --s2: 12px; --s3: 16px; --s4: 24px; --s5: 44px;

    color-scheme: dark;
    --bg: #141414; --surface: #1e1f24; --raised: #2a2b34;
    --text: #f5f5f7; --text-2: rgba(245,245,247,.6); --text-3: rgba(245,245,247,.5); --faint: rgba(245,245,247,.3);
    --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.12); --scrim: rgba(255,255,255,.03);

    --link: #93a5ff; --danger-soft: rgba(223,79,65,.16);

/* ============ Base ============ */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

  animation: rise var(--dur) var(--ease) both; }

.row:first-child { border-top-color: transparent; }
.row.open, .row.open + .row { border-top-color: transparent; }
.row.open { background: var(--raised); box-shadow: var(--shadow-float); }
.row.arrive { animation: rise 520ms var(--ease) both; }
.row-head { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px var(--s2); width: 100%; padding: var(--s2) var(--s3) var(--s2) 4px;

.row-head:hover { background: var(--scrim); }
.row.open .row-head:hover { background: none; }
.row-head .t { font: 12px/21px var(--font-mono); color: var(--text-2); text-align: right; }
.sent { font-size: 15.5px; line-height: 1.4; overflow-wrap: anywhere; }
.tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tags:empty { display: none; }
.chip { display: inline-flex; align-items: center; max-width: 100%; height: 22px; padding: 0 9px; border-radius: var(--r-pill); border: 1px solid var(--line-strong);
  font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.sim { border-style: dashed; }

.row.liverow { background: var(--danger-soft); }

.more { margin: var(--s2) 0 0 calc(64px + var(--s2) + 4px); }
.empty-line { color: var(--text-3); font-size: 14px; padding: var(--s2) 4px; }

.footer span { flex: 1; min-width: 0; }

.notice span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.empty { margin-top: var(--s4); padding: var(--s5) var(--s4); text-align: center; border-radius: var(--r-card); background: var(--surface); }

.empty p { color: var(--text-2); }
.empty pre { display: inline-block; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 var(--s3); padding: var(--s2) var(--s3);
  border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); font: 13px var(--font-mono); text-align: left; }
@media (max-width: 640px) {
  .wrap { padding: var(--s2) var(--s3) var(--s5); }
  .hero { padding: var(--s3); border-radius: 24px; }
  .nowline { font-size: 28px; margin-top: var(--s4); }
  .row-head { grid-template-columns: minmax(0, 1fr); padding: var(--s2) var(--s2) var(--s2) 4px; }
  .row-head .t { text-align: left; line-height: 1.4; }
  .tags { grid-column: 1; }
  .row-body, .more, .footnote { padding-left: 4px; margin-left: 0; }
  .row-body { padding: 0 var(--s2) var(--s2) 4px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>

<body>
<div class="wrap">
  <header class="hero" id="hero">
    <div class="topbar">
      <div class="brand"><span class="wordmark">timo</span><em>agent</em></div>
      <span class="hpill connecting" id="livePill" role="status" aria-live="polite"><span class="dot"></span><span>Connecting</span></span>
    </div>
    <p class="nowline" id="nowline" aria-live="polite"></p>
    <button class="btn glass" id="replayBtn" type="button"></button>
  </header>
  <div id="notice"></div>
  <main id="main"></main>
  <footer class="footer" id="footer"></footer>
</div>
<script>
(() => {
'use strict';
const TZ = 'America/Los_Angeles', LIVE_MS = 2000, REPLAY_MS = 16000, DAY0 = 420, DAY1 = 1140, DONE_MAX = 4;
const $ = (id) => document.getElementById(id);

/* ---------- DOM helpers (data only ever goes through textContent / setAttribute) ---------- */

/* ---------- Time (always America/Los_Angeles) ---------- */

const fmtMin = (m) => { const hr = Math.floor(m / 60) % 24; return `${hr % 12 || 12}:${String(Math.floor(m % 60)).padStart(2, '0')}${hr < 12 ? 'am' : 'pm'}`; };

/* ---------- State ---------- */
const S = { snap: null, entries: [], open: new Set(), showAll: false, showDay: false, replay: null, doneKeys: null, errHidden: false, errKey: '', liveSig: null, liveBusy: false,

/* ---------- Data loading ---------- */

/* ---------- "Now" is real LA time, or the replay sweep ---------- */
const nowMin = () => S.replay ? S.replay.min : minOfDay(new Date());
function isDone(e) {

  const t = toDate(e.at); return !!t && t.getTime() <= Date.now();

const outcome = (e) => str(obj(e.decision).outcome);

/* ---------- Plain-language sentences ---------- */

  const m = minOfDay(at); if (m == null) return null;

}

  }

    if (item && kind === 'free_slot') return future ? `text ${name} to start ${item}` : `Texted ${name}: do ${item}${where}`;
    return future ? `text ${name}: ${lc(sum)}` : `Texted ${name}: ${lc(sum)}`;
  }
  if (d.channel === 'call') {

    return future ? `call ${name}: ${lc(sum)}` : `Called ${name}: ${lc(sum)}`;

}
function whyLine(e) {
  const d = obj(e.decision), pick = pickedOf(e), g = gapAt(e.at), kind = str(e.kind);
  if (outcome(e) === 'hold') return 'Not worth an interruption right now.';
  if (pick && kind === 'voice_call') return arr(e.pending).length || arr(e.actions).some((a) => obj(a).status === 'pending_confirmation')
    ? 'It was next in Timo’s queue, and nothing happens until you say Y.' : 'It was next in Timo’s queue.';
  if (pick) {
    const due = fmtTime(pick.due), mins = num(pick.minutes), bits = [];
    if (due) {
      const dd = fYMD.format(toDate(pick.due)), ad = toDate(e.at) ? fYMD.format(toDate(e.at)) : dd;
      const tmr = toDate(e.at) && fYMD.format(new Date(toDate(e.at).getTime() + 864e5)) === dd;
      bits.push(dd === ad ? `it’s due at ${due}` : tmr ? `it’s due tomorrow at ${due}` : `it’s due ${fWk.format(toDate(pick.due))} at ${due}`);

const CHIP = { calendar_block: 'Blocked', todoist_in_progress: 'Marked in progress', todoist_done: 'Marked done', todoist_rescheduled: 'Rescheduled', draft: 'Drafted' };
function chipText(a) {
  const base = CHIP[str(a.kind)]; if (!base) return '';
  if (a.kind === 'calendar_block') { const r = str(a.label).match(/\d{1,2}(:\d{2})?\s*[ap]?m?\s*[–-]\s*\d{1,2}(:\d{2})?\s*[ap]m/i); return r ? `Blocked ${r[0].replace(/\s+/g, '')}` : 'Blocked calendar'; }

}
const awaitingY = (e) => arr(e.pending).length > 0 || arr(e.actions).some((a) => obj(a).status === 'pending_confirmation');

/* ---------- Live calls, read from the running Timo app's /voice/sessions ---------- */
const CALL_DONE = /^(awaiting_transcript|resolving|resolved|processed|processing|finished|ending|ended|completed)$/;
const CALL_FAIL = /^(failed|call_unknown|needs_review|unavailable|limit_reached)$/;
const liveCalls = () => S.live.sessions.filter((s) => (s.mode === 'live' || s.mode === 'dry_run') && toDate(s.createdAt));
function callState(s) {
  const st = str(s.status), cs = str(s.conversationStatus), dec = str(s.decision);
  if (s.mode !== 'live') return { key: 'test', label: 'Test run, not dialed' };
  if (CALL_FAIL.test(st)) return { key: 'fail', label: 'Live call · didn’t connect' };
  if (CALL_DONE.test(st) || CALL_DONE.test(cs) || (dec && dec !== 'pending')) return { key: 'ended', label: 'Live call · ended' };
  if (!str(s.callId)) return { key: 'dialing', label: 'Live · dialing' };
  return { key: 'active', label: 'Live call · in progress' };
}
const callTitle = (s) => str(obj(obj(s.recommendation).pick).title) || str(obj(s.fixture).title);
const activeCall = () => liveCalls().find((s) => s.mode === 'live' && ['dialing', 'active'].includes(callState(s).key));

const about = (t) => t ? ` about ${lc(t)}` : '';
const byAt = (a, b) => ((toDate(a.at) || 0) - (toDate(b.at) || 0));

/* ---------- Sky gradient follows "now" ---------- */
const SKY = [[0, ['#1c2340', '#3b4a78', '#6d5a7a']], [360, ['#2c3561', '#77709f', '#c99088']], [450, ['#5a6aa0', '#c3a9c8', '#e8a48a']],
  [560, ['#4a67c9', '#8c9ff2', '#d3bfda']], [720, ['#3e5bd6', '#7d92f5', '#a6b4fa']], [900, ['#4560c4', '#8f9ef0', '#c7b0d4']],
  [1020, ['#4a5f8f', '#a6b4fa', '#e8a48a']], [1170, ['#262f55', '#4a5f8f', '#a3788a']], [1440, ['#1c2340', '#3b4a78', '#6d5a7a']]];
const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
function setSky(m) {
  if (m == null) return;
  let i = 0; while (i < SKY.length - 2 && SKY[i + 1][0] <= m) i++;
  const [m0, c0] = SKY[i], [m1, c1] = SKY[i + 1], t = clamp((m - m0) / (m1 - m0 || 1), 0, 1);
  ['a', 'b', 'c'].forEach((k, j) => { const a = rgb(c0[j]), b = rgb(c1[j]);
    $('hero').style.setProperty('--sky-' + k, `rgb(${a.map((x, n) => Math.round(x + (b[n] - x) * t)).join(',')})`); });
}

/* ---------- Render ---------- */
function render() {
  const nm = nowMin();
  setSky(nm);
  const rb = $('replayBtn');
  rb.replaceChildren(icon(S.replay ? 'x' : 'play', 12), S.replay ? 'Stop' : 'Run through the day');
  renderFooter();
  if (!S.snap) {
    $('nowline').textContent = `Now ${fmtMin(nm)}.`;
    $('main').replaceChildren(h('section', { class: 'empty' }, h('h2', { text: 'No snapshot to show yet' }),
      h('p', { text: 'Start the dashboard server from the repo root:' }), h('pre', { text: 'uv run uvicorn dashboard.server:app --port 8100' }), h('br'),
      h('button', { class: 'btn', type: 'button', onclick: loadSnapshot }, icon('refresh'), 'Try again')));
    return;
  }
  const shown = S.entries.filter((e) => outcome(e) !== 'nothing');
  const lives = S.replay ? [] : liveCalls().map((s) => ({ _k: 'live:' + str(s.sessionId), _live: s, at: s.createdAt }));
  const done = shown.filter(isDone).concat(lives).sort(byAt).reverse(), later = shown.filter((e) => !isDone(e));
  const standby = !S.replay && !recentCall(), act = !S.replay && activeCall(), name = userName();
  const quiet = S.entries.filter((e) => outcome(e) === 'nothing' && isDone(e)).length;
  const prev = S.doneKeys; S.doneKeys = new Set(done.map((e) => e._k));
  const next = later[0];
  $('nowline').replaceChildren(h('span', { text: `Now ${nm == null ? '' : fmtMin(nm)}. ` }),
    h('span', { class: 'next', text: act ? (callState(act).key === 'dialing' ? `Timo is calling ${name}, live.` : `Timo is on a live call with ${name}.`)
      : standby ? `Next: right now, Timo calls ${name} live${about(str(S.live.preview.title))}.`
      : next ? `Next: ${fmtTime(next.at)}, ${period(describe(next, true))}` : 'Nothing else planned today.' }));
  renderNotice();
  const pend = arr(obj(obj(S.snap).user).pending).map(obj).filter((p) => str(p.summary) && !S.entries.some((e) => arr(e.pending).some((q) => str(obj(q).id) && str(obj(q).id) === str(p.id))));
  const visible = S.showAll ? done : done.slice(0, DONE_MAX);
  $('main').replaceChildren(contextLine(),
    h('section', { class: 'sec' }, h('h2', { text: 'Done' }),
      done.length || pend.length ? h('div', { class: 'rows' }, pend.map(pendingRow), visible.map((e) => row(e, false, prev && !prev.has(e._k))))
        : h('div', { class: 'empty-line', text: 'Nothing yet today.' }),
      done.length > DONE_MAX ? h('div', { class: 'more' }, h('button', { class: 'link', type: 'button', onclick: () => { S.showAll = !S.showAll; render(); } },
        S.showAll ? 'Show fewer' : `Show all ${done.length}`)) : null,
      quiet ? h('p', { class: 'footnote', text: `Checked ${quiet} other gap${quiet === 1 ? '' : 's'}, nothing worth interrupting for.` }) : null),
    h('section', { class: 'sec' }, h('h2', { text: 'Coming up' }),
      later.length || standby ? h('div', { class: 'rows' }, standby ? standbyRow() : null, later.map((e) => row(e, true, false)))
        : h('div', { class: 'empty-line', text: 'Nothing else planned today.' })));
}
function contextLine() {
  const snap = obj(S.snap), user = obj(snap.user), day = obj(snap.day);
  const facts = arr(user.facts).map(obj), commute = facts.find((f) => /commute/.test(str(f.key)) && str(f.value));
  const events = arr(day.events).map(obj), gaps = arr(day.gaps).map(obj);
  const bits = [str(user.name) && h('b', { text: str(user.name) }), commute && `commutes by ${str(commute.value)}`,
    user.channel === 'sms' ? 'prefers text' : user.channel === 'call' ? 'prefers calls' : '',

  gaps.forEach((g) => { const m = minOfDay(g.start), um = num(g.usable_minutes) ?? num(g.minutes); if (m != null && um != null) items.push({ m: m + 0.5, el: h('span', { class: 'gap', text: `${um} min free` }) }); });

function liveRow(e, arrive) {

  const said = str(obj(s.fixture).say) || str(obj(s.recommendation).speech_text);
  const sent = s.mode === 'live' ? `Called ${name} live over Dial${about(title)}` : `Test run: would call ${name}${about(title)}`;
  const el = h('article', { class: 'row' + (s.mode === 'live' ? ' liverow' : '') + (open ? ' open' : '') + (arrive ? ' arrive' : '') },
    h('button', { class: 'row-head', type: 'button', 'aria-expanded': open ? 'true' : 'false', onclick: () => { open ? S.open.delete(e._k) : S.open.add(e._k); render(); } },
      h('span', { class: 't', text: fmtTime(s.createdAt) }),

      h('span', { class: 'tags' }, h('span', { class: 'chip ' + (s.mode === 'live' ? 'live' + (st.key === 'ended' || st.key === 'fail' ? ' ended' : '') : 'test'), text: st.label }),

}
function standbyRow() {

    h('span', { class: 't', text: fmtMin(nowMin()) }),
    h('span', { class: 'sent', text: `Will call ${userName()} live over Dial${about(str(S.live.preview.title))}.` }),
    h('span', { class: 'tags' }, h('span', { class: 'chip live', text: S.live.connected ? 'Live · standing by' : 'Live · Timo app offline' }))));
}
function row(e, later, arrive) {
  if (e._live) return liveRow(e, arrive);
  const open = S.open.has(e._k), acts = arr(e.actions).map(obj);
  const chips = acts.map((a) => ({ a, t: chipText(a) })).filter((x) => x.t).slice(0, 2);
  const el = h('article', { class: 'row' + (later ? ' later' : '') + (open ? ' open' : '') + (arrive ? ' arrive' : '') },
    h('button', { class: 'row-head', type: 'button', 'aria-expanded': open ? 'true' : 'false', onclick: () => { open ? S.open.delete(e._k) : S.open.add(e._k); render(); } },
      h('span', { class: 't', text: fmtTime(e.at) }),
      h('span', { class: 'sent', text: period(later ? 'Will ' + describe(e, true) : describe(e, false)) }),
      h('span', { class: 'tags' }, outcome(e) === 'hold' ? h('span', { class: 'chip held', text: 'held' }) : null,
        !later && awaitingY(e) ? h('span', { class: 'chip ask', text: 'awaiting Y' }) : null,
        chips.map(({ a, t }) => h('span', { class: 'chip' + (a.status === 'simulated' ? ' sim' : a.status === 'skipped' ? ' skip' : ''), title: a.status === 'simulated' ? 'Simulated in demo mode' : null, text: t })))));
  if (open) {
    const why = whyLine(e), msgs = arr(e.messages).map(obj).filter((m) => str(m.text));
    el.append(h('div', { class: 'row-body' }, why ? h('p', { class: 'why', text: why }) : null,
      msgs.length ? h('div', { class: 'bubbles' }, msgs.map((m, j) => h('div', { class: 'bubble' + (m.direction === 'in' ? ' me' : ''), style: { '--d': j * 180 + 'ms' } },
        h('small', { text: (m.direction === 'in' ? userName() : 'Timo') + (m.channel === 'call' ? ', on a call' : '') }), str(m.text)))) : null,
      !why && !msgs.length ? h('p', { class: 'why', text: 'No message was sent.' }) : null));

}
function pendingRow(p) {
  return h('article', { class: 'row' }, h('div', { class: 'row-head', style: { cursor: 'default' } }, h('span', { class: 't', text: fmtTime(p.created_at) }),
    h('span', { class: 'sent', text: period(str(p.summary)) }), h('span', { class: 'tags' }, h('span', { class: 'chip ask', text: 'awaiting Y' }))));
}
function renderNotice() {
  const box = $('notice'); box.replaceChildren();
  let errs = S.snap && S.snap.errors;
  if (typeof errs === 'string') errs = [errs];
  else if (errs && typeof errs === 'object' && !Array.isArray(errs)) errs = Object.values(errs);
  errs = arr(errs).map((x) => typeof x === 'string' ? x : str(obj(x).message)).filter(Boolean);
  if (!errs.length || S.errHidden) return;
  box.append(h('div', { class: 'notice', role: 'alert' }, h('span', { text: 'Some data could not load: ' + trunc(errs.join(' · '), 200) }),
    h('button', { class: 'btn icon', type: 'button', 'aria-label': 'Dismiss', onclick: () => { S.errHidden = true; renderNotice(); } }, icon('x'))));
}
function renderFooter() {
  const m = obj(obj(S.snap).mode), bits = [];
  if (m.use_mocks === true) bits.push('Demo data'); else if (m.use_mocks === false) bits.push('Live data');
  const rd = obj(S.live.readiness);
  if (typeof rd.live_calls_enabled === 'boolean') bits.push(rd.live_calls_enabled ? 'live calls on' : 'live calls off');
  else if (m.live_calls_enabled === false) bits.push('calls off'); else if (m.live_calls_enabled === true) bits.push('calls live');
  const ex = str(m.external_execution);
  if (/^(disabled|simulated?)$/.test(ex)) bits.push('actions simulated'); else if (ex) bits.push('external actions on');
  $('footer').replaceChildren(h('span', { text: bits.length ? cap(bits.join(' · ')) : 'Timo dashboard' }),
    h('button', { class: 'btn icon', type: 'button', title: 'Refresh', 'aria-label': 'Refresh', onclick: loadSnapshot }, icon('refresh')));
}

/* ---------- Run-through: sweep "now" from 7am to the real current time, then live mode takes over ---------- */
function toggleReplay() {
  if (S.replay) { cancelAnimationFrame(S.replay.raf); S.replay = null; S.doneKeys = null; render(); return; }
  const target = clamp(minOfDay(new Date()) ?? DAY1, DAY0 + 30, 1439);
  S.replay = { start: performance.now(), min: DAY0, last: -1, raf: 0, target, ms: Math.max(6000, REPLAY_MS * (target - DAY0) / (DAY1 - DAY0)) };
  S.doneKeys = new Set(); S.showAll = false;
  const step = (t) => {
    if (!S.replay) return;
    const p = clamp((t - S.replay.start) / S.replay.ms, 0, 1);
    S.replay.min = DAY0 + (S.replay.target - DAY0) * (1 - (1 - p) * (1 - p));
    if (p >= 1) { S.replay = null; S.standbyIn = true; render(); S.standbyIn = false; return; }
    const whole = Math.floor(S.replay.min / 5);
    if (whole !== S.replay.last) { S.replay.last = whole; render(); }
    S.replay.raf = requestAnimationFrame(step);
  };
  render(); S.replay.raf = requestAnimationFrame(step);
}
$('replayBtn').addEventListener('click', toggleReplay);

/* ---------- Live pill (read-only GET); refetch the snapshot when the app changes ---------- */
function setPill(state, detail) {
  const p = $('livePill'); p.className = 'hpill ' + state; p.title = detail || '';
  p.replaceChildren(h('span', { class: 'dot' }), h('span', { text: state === 'live' ? 'Live: connected' : 'Timo app offline' }));
}
async function pollLive() {
  if (S.liveBusy) return; S.liveBusy = true;
  try {
    const r = obj(await getJSON('/api/live', 4000)), ok = r.connected === true;
    setPill(ok ? 'live' : 'offline', ok ? 'Connected to the Timo app' : 'The Timo app is not reachable');
    S.live = { connected: ok, sessions: arr(r.sessions).map(obj), preview: obj(r.preview), readiness: obj(r.readiness) };
  } catch (_) { setPill('offline', 'The dashboard server is not reachable'); S.live = Object.assign({}, S.live, { connected: false }); }
  finally {
    S.liveBusy = false;
    const sig = JSON.stringify([S.live.connected, str(S.live.preview.title), S.live.readiness.live_calls_enabled,
      S.live.sessions.map((x) => [x.sessionId, x.status, x.conversationStatus, x.callId, x.decision])]);
    if (sig !== S.liveSig && !S.replay) render();
    S.liveSig = sig;

render();
loadSnapshot().then(pollLive);
setInterval(pollLive, LIVE_MS);
setInterval(() => { if (!S.replay) render(); }, 10000);
})();
